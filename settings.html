<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/timer.css">
    <link rel="stylesheet" href="css/set-time.css">
    <title>Timer</title>
</head>
<body>
    <header class="header">
        <a href="index.html" class="header_title">Timer</a>
        <div class="header_buttons" >
            <a href="pomodoro-timer.html">
                <img src="src/img/pomodoro-technique.png" alt="" title="Помодоро таймер">
            </a>
            <a href="settings.html">
                <img src="src/img/gear.png" alt="" title="Настройки">
            </a>
        </div>
    </header>
    <main class="main">
        <h1 class="settings-title">Settings</h1>
        <div class="main_settings">
            <label for="" class="settings_el" id="theme-container">
                Theme: 
                Light<input type="radio" name="theme" id="light"> 
                Dark<input type="radio" name="theme" id="dark">
            </label><br>
            <label for="" class="settings_el">
                Melody:
                    <select class="select" name="" id="">
                        <option selected value="../src/music/1.mp3">Option 1</option>
                        <option value="../src/music/2.mp3">Option 2</option>
                        <option value="../src/music/3.mp3">Option 3</option>
                        <option value="../src/music/4.mp3">Option 4</option>                 
                    </select>
            </label>
        </div>
    </main>
    <footer class="footer">
        <div class="footer_info">
            <a href="https://github.com/SultanVortik/Timer">GitHub</a>
            <span>By Magomedov Sultan</span>
        </div>
    </footer>
    <script type="module" src="js/settings.js"></script>
</body>
</html>
